<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Named, so a browser stops guessing at /favicon.ico and being handed the
         app shell by the SPA fallback. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>smrt control</title>
    <script>
      // Runs before the stylesheet paints: read the stored choice, resolve
      // "system" against the desktop, and put the answer on the root. The store
      // in theme.svelte.ts owns the same key and agrees with this by construction.
      (function () {
        try {
          var c = localStorage.getItem('smrt.theme') || 'system';
          var light =
            c === 'light' ||
            (c === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
