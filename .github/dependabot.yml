version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # rusqlite 0.40 pulls libsqlite3-sys 0.38, whose build.rs uses the unstable
      # cfg_select feature and fails to compile on stable Rust. Hold the major
      # until libsqlite3-sys ships a build script that builds on stable.
      - dependency-name: rusqlite
        update-types: [version-update:semver-major]
      # rand 0.10 restructured its trait API (RngCore, Rng::fill, random all
      # moved or removed) and the migration is not a mechanical bump. Hold the
      # major for a deliberate migration against the 0.10 docs, not a guess.
      - dependency-name: rand
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the Go rewrite (tsgo); svelte-check does not support its
      # module API yet and dies on it. Hold the major until the Svelte toolchain
      # catches up; minor/patch of 5.x still come through.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
